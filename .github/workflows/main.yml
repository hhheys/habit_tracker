name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: ./... --timeout=5m

      - name: Run tests
        run: go test -v ./...

      - name: Check Go build
        run: go build -v ./cmd/server

      - name: Check Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: habit-tracker:test
