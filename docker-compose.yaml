services:
  habit-tracker-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habit-tracker
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "${SERVER_PORT:-8080}"

      POSTGRES_HOST: "habit-tracker-db"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-habit_tracker}"
      POSTGRES_SSL_MODE: "${POSTGRES_SSL_MODE:-disable}"

      JWT_SECRET: "${JWT_SECRET:-secret-change-me-in-production}"

      KAFKA_BROKERS: "kafka:29092"
      KAFKA_OUTBOX_TOPIC: "habit.events.v1"
      OUTBOX_PUBLISH_INTERVAL: "${OUTBOX_PUBLISH_INTERVAL:-5s}"
    depends_on:
      habit-tracker-db:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - habit-tracker-images:/app/images
    restart: unless-stopped
    networks:
      - internal

  habit-tracker-db:
    image: postgres:16-alpine
    container_name: habit-tracker-db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-habit_tracker}"
    ports:
      - "5433:5432"
    volumes:
      - habit-tracker-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-habit_tracker}"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - internal

  kafka:
    image: apache/kafka:4.0.0
    container_name: habit-tracker-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - internal

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      - kafka
    networks:
      - internal
    command:
      - bash
      - -c
      - |
        sleep 10 && \
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic habit.events.v1 \
          --partitions 3 \
          --replication-factor 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: habit-tracker-kafka-ui
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_CLUSTERS_0_NAME: habit-tracker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - internal

networks:
  internal:

volumes:
  habit-tracker-db:
  habit-tracker-images: