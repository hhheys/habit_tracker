services:
  habit-tracker-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: room-service
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: "${SERVER_HOST:-0.0.0.0}"
      SERVER_PORT: "${SERVER_PORT:-8080}"
      POSTGRES_HOST: "${POSTGRES_HOST:-db}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-habit_tracker}"
      POSTGRES_SSL_MODE: "${POSTGRES_SSL_MODE:-disable}"
      JWT_SECRET: "${JWT_SECRET:-secret-change-me-in-production}"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - internal

  habit-tracker-db:
    image: postgres:16-alpine
    container_name: room-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-habit_tracker}
    ports:
      - "5432:5432"
    volumes:
      - habit-tracker-db:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  habit-tracker-db:
