version: "2"
run:
  go: "1.21"
  timeout: 2m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gocritic
    - revive

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  revive:
    severity: warning

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  format: colored-line-number